<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NexaApp</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141416;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(255,255,255,0.25);
      --text: #f0f0f0;
      --muted: #666;
      --accent: #e8ff57;
      --accent-dim: rgba(232,255,87,0.12);
      --google: #fff;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background blobs */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: #e8ff57;
      top: -100px; left: -100px;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: #57c4ff;
      bottom: -80px; right: -80px;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(60px, 80px); } }
    @keyframes drift2 { to { transform: translate(-60px, -60px); } }

    /* Subtle grid pattern */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 80px rgba(0,0,0,0.6);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .logo-mark span {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #0d0d0f;
      line-height: 1;
    }
    .logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* Form */
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus {
      border-color: var(--border-focus);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(232,255,87,0.07);
    }

    /* Password row */
    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .password-row label { margin-bottom: 0; }
    .forgot {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    .forgot:hover { opacity: 1; }

    /* Submit */
    .btn-primary {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: var(--accent);
      color: #0d0d0f;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      letter-spacing: 0.1px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(232,255,87,0.25);
    }
    .btn-primary:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Google */
    .btn-google {
      width: 100%;
      padding: 13px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.14);
    }
    .btn-google svg { flex-shrink: 0; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .footer a:hover { opacity: 1; }
  </style>
</head>
<body>

<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<div class="grid-bg"></div>

<div class="card">
  <div class="logo">
    <div class="logo-mark"><span>N</span></div>
    <span class="logo-name">NexaApp</span>
  </div>

  <h1>Bienvenido de vuelta</h1>
  <p class="subtitle">Ingresa tus datos para continuar</p>

  <form onsubmit="handleLogin(event)">
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="tu@correo.com" required />
    </div>

    <div class="field">
      <div class="password-row">
        <label for="password">Contraseña</label>
        <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
      </div>
      <input id="password" type="password" placeholder="••••••••" required />
    </div>

    <button type="submit" class="btn-primary">Iniciar sesión</button>
  </form>

  <div class="divider"><span>o continúa con</span></div>

  <button class="btn-google" onclick="handleGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continuar con Google
  </button>

  <p class="footer">¿No tienes cuenta? <a href="#">Regístrate gratis</a></p>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-primary');
    btn.textContent = 'Iniciando sesión...';
    btn.style.opacity = '0.7';
    setTimeout(() => {
      btn.textContent = '✓ Sesión iniciada';
      btn.style.background = '#57ff9a';
      setTimeout(() => {
        btn.textContent = 'Iniciar sesión';
        btn.style.opacity = '1';
        btn.style.background = 'var(--accent)';
      }, 2000);
    }, 1200);
  }

  function handleGoogle() {
    alert('Conectar con Google — integra tu backend aquí.');
  }
</script>
</body>
</html>
